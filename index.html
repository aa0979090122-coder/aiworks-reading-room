<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="社群貼文、Podcast、新聞、企業案例與研究報告。">
<title>資訊情報站</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20261003-5"><script type="module" src="./main.js?v=20261003-5"></script>
</head>
<body>
<header class="site-header" id="top"><div class="header-inner"><h1>資訊情報站</h1><time id="edition-date"></time><button id="connect-local" class="text-button">本機版 ↗</button><span id="local-status" role="status"></span></div></header>
<main>
<div class="tabs-shell"><nav class="tabs wrap" aria-label="內容分類">
<button id="tab-x-posts" aria-pressed="true" aria-controls="x-posts" data-tab="x-posts">社群貼文 <span id="x-count"></span></button>
<button id="tab-podcasts" aria-pressed="false" aria-controls="podcasts" data-tab="podcasts">Podcast <span id="podcast-count"></span></button>
<button id="tab-news" aria-pressed="false" aria-controls="news" data-tab="news">新聞 <span id="news-count"></span></button>
<button id="tab-deep-dives" aria-pressed="false" aria-controls="deep-dives" data-tab="deep-dives">深度選題 <span id="deep-count"></span></button>
<button id="tab-knowledge" aria-pressed="false" aria-controls="knowledge" data-tab="knowledge">我的知識庫 <span id="knowledge-count"></span></button>
</nav></div>
<div id="reading-status" class="reading-status wrap" role="status" aria-live="polite"></div>
<div class="content wrap">
<section id="x-posts" class="panel" aria-labelledby="tab-x-posts"><section id="daily-digest" class="daily-digest" aria-label="過去24小時摘要"></section><div class="list-toolbar"><label class="search-label"><input id="social-search" type="search" placeholder="搜尋貼文" aria-label="搜尋社群貼文"></label><button class="text-button" data-view="x-posts">已讀與歷史</button></div><div id="posts-list" class="posts-list"></div></section>
<section id="podcasts" class="panel" aria-labelledby="tab-podcasts" hidden><div class="list-toolbar"><span></span><button class="text-button" data-view="podcasts">已讀與歷史</button></div><div id="podcasts-list" class="podcasts-list"></div></section>
<section id="news" class="panel" aria-labelledby="tab-news" hidden><div class="list-toolbar"><span></span><button class="text-button" data-view="news">已讀與歷史</button></div><div id="news-list" class="news-list"></div></section>
<section id="deep-dives" class="panel" aria-labelledby="tab-deep-dives" hidden><div class="list-toolbar"><div class="topic-filters"><button class="topic-button" data-deep-filter="all" aria-pressed="true">全部</button><button class="topic-button" data-deep-filter="case" aria-pressed="false">標竿案例</button><button class="topic-button" data-deep-filter="research" aria-pressed="false">研究報告</button><button class="topic-button" data-deep-filter="failure" aria-pressed="false">失敗與修正</button></div><button class="text-button" data-view="deep-dives">已讀與歷史</button></div><div id="deep-list" class="deep-list"></div></section>
<section id="knowledge" class="panel" aria-labelledby="tab-knowledge" hidden>
<div class="knowledge-tools"><button id="export-notes" class="text-button">匯出 Markdown</button><button id="export-backup" class="text-button">備份</button><label class="text-button import-label">匯入<input id="import-backup" type="file" accept="application/json,.json" hidden></label><button id="refresh-local" class="text-button" hidden>重讀本機筆記</button></div>
<details class="general-notes"><summary>整體筆記與選文回饋</summary><section class="notes-section"><div class="notes-heading"><button id="copy-feedback" class="text-button">複製回饋</button></div><textarea id="reading-notes" aria-label="整體筆記"></textarea><p id="save-status" class="save-status" role="status"></p><details class="feedback-details"><summary>閱讀紀錄</summary><div id="feedback-list"></div></details></section></details>
<div class="knowledge-controls"><input id="knowledge-search" type="search" placeholder="搜尋筆記、概念" aria-label="搜尋知識庫"><select id="knowledge-outcome" aria-label="依資料類型篩選"><option value="all">全部</option><option value="failure">失敗與修正</option><option value="case">實作案例</option><option value="research">研究與報告</option><option value="mixed">結果與限制</option><option value="perspective">觀點與新知</option></select></div>
<div class="knowledge-layout"><nav id="knowledge-nav" class="knowledge-nav" aria-label="知識庫章節"></nav><div id="knowledge-list" class="knowledge-list"></div></div><p id="knowledge-status" role="status" class="save-status"></p>
</section>
</div></main>
<dialog id="reject-dialog" aria-labelledby="reject-title"><form id="reject-form"><h2 id="reject-title">這篇為什麼沒幫助？</h2><textarea id="reject-reason" required aria-label="沒幫助的理由" placeholder="例如：只有成果數字，沒有實際做法。"></textarea><p id="reject-error" role="status"></p><div class="dialog-actions"><button type="button" id="cancel-reject">取消</button><button type="submit" class="primary-button">儲存理由</button></div></form></dialog>
<footer class="site-footer"><div class="wrap"><a href="#top">回到頂端 ↑</a></div></footer>
</body></html>
