<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="近 14 天的 AI 消息、中文摘要與延伸閱讀。">
<title>AI 情報站</title>
<link rel="stylesheet" href="./styles.css?v=20261102-1"><script type="module" src="./main.js?v=20261102-1"></script>
</head>
<body>
<header class="site-header" id="top"><div class="header-inner"><h1>AI 情報站</h1><time id="edition-date"></time><details class="data-tools"><summary>閱讀紀錄</summary><div><button id="export-backup">備份紀錄</button><label class="import-label">匯入紀錄<input id="import-backup" type="file" accept="application/json,.json" hidden></label><button id="copy-feedback">複製回饋</button><a href="http://127.0.0.1:8766/" target="_blank" rel="noopener">本機版 ↗</a><p id="local-status" role="status">紀錄存於這個瀏覽器。</p></div></details></div></header>
<main class="wrap">
<nav class="tabs" aria-label="內容分類"><button data-tab="curiosity" aria-pressed="true" aria-controls="curiosity">最近有什麼</button><button data-tab="materials" aria-pressed="false" aria-controls="materials">全部素材 <span id="material-count"></span></button></nav>
<div id="reading-status" role="status" aria-live="polite"></div>
<section id="curiosity" class="panel" aria-label="最近有什麼">
<div class="page-heading"><h2>最近有什麼</h2><p>近期消息與背景，整理成中文，想多了解再看延伸閱讀。</p></div>
<div class="toolbar"><div class="curiosity-lanes" aria-label="話題類型"><button data-curiosity-lane="all" aria-pressed="true">全部</button><button data-curiosity-lane="event" aria-pressed="false">新聞與事件</button><button data-curiosity-lane="feature" aria-pressed="false">功能與工具</button><button data-curiosity-lane="case" aria-pressed="false">導入案例</button><button data-curiosity-lane="discussion" aria-pressed="false">社群討論</button></div><label>顯示 <select id="curiosity-view"><option value="latest">最近整理</option><option value="all">近 14 天全部話題</option><option value="interested">有興趣的</option><option value="read">看過的簡介</option><option value="removed">已刪除</option></select></label></div>
<div id="curiosity-list"></div>
</section>
<section id="materials" class="panel" aria-label="全部素材" hidden><div class="page-heading"><h2>全部素材</h2><p id="window-label"></p></div><div class="toolbar material-toolbar"><input id="material-search" type="search" placeholder="搜尋標題、摘要或來源" aria-label="搜尋全部素材"><select id="material-kind" aria-label="素材來源"><option value="all">全部來源</option><option value="posts">社群貼文</option><option value="news">新聞與文章</option><option value="podcasts">播客節目</option></select><select id="material-view" aria-label="素材顯示方式"><option value="all">全部</option><option value="interested">有興趣的</option><option value="read">看過的</option><option value="removed">已刪除</option></select></div><p id="material-result-count" class="result-count"></p><div id="all-materials"></div></section>
<details class="general-notes"><summary>我的想法與選文回饋</summary><textarea id="reading-notes" aria-label="整體筆記" placeholder="有什麼想繼續追，或希望少看到的內容？"></textarea><p id="save-status" role="status"></p></details>
</main><footer class="site-footer wrap"><span>閱讀與興趣存於這個瀏覽器，可備份帶走。</span><a href="#top">回到頂端 ↑</a></footer>
</body></html>
